<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f1ea">
<title>Ricin Xpress — Maintenance</title>
<style>
:root{--bg:#f4f1ea;--ink:#1e1e1e;--muted:#6f6b63;--accent:#c49a57;--card:rgba(255,255,255,.66);--border:rgba(30,30,30,.10)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 15%,rgba(196,154,87,.16),transparent 35%),radial-gradient(circle at 85% 85%,rgba(30,30,30,.06),transparent 35%),var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.page{position:relative;width:min(960px,100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.glow{position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(196,154,87,.10);filter:blur(60px);top:8%;left:-7%;pointer-events:none}
.glow.two{top:auto;left:auto;right:-8%;bottom:4%;background:rgba(30,30,30,.06)}
.card{position:relative;width:min(720px,100%);text-align:center;padding:58px 42px 46px;border:1px solid var(--border);border-radius:28px;background:var(--card);backdrop-filter:blur(16px);box-shadow:0 24px 80px rgba(30,30,30,.10);animation:rise .8s ease-out both}
.brand{display:flex;justify-content:center;align-items:center;margin-bottom:34px}
.logo-wrap{display:flex;align-items:flex-end;gap:12px}
.logo{width:min(240px,55vw);height:auto;display:block}
.xpress{font-family:Georgia,serif;font-size:20px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:11px;color:#8b6a35}
.status{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;border:1px solid rgba(196,154,87,.35);background:rgba(196,154,87,.10);color:#7c5d2f;font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(196,154,87,.45);animation:pulse 1.8s infinite}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(42px,7vw,76px);line-height:.98;letter-spacing:-.035em;margin:24px 0 18px}
p{max-width:560px;margin:0 auto;color:var(--muted);font-size:17px;line-height:1.7}
.message{margin-top:28px;padding:18px 20px;border-radius:16px;background:rgba(255,255,255,.58);border:1px solid rgba(30,30,30,.07);font-size:14px;color:#5e5a53}
.footer{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:34px;color:#89847b;font-size:12px}
.footer span::before{content:"•";margin-right:18px;color:#b7afa3}
.footer span:first-child::before{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,154,87,.5)}70%{box-shadow:0 0 0 10px rgba(196,154,87,0)}100%{box-shadow:0 0 0 0 rgba(196,154,87,0)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:560px){.page{padding:18px}.card{padding:42px 24px 32px;border-radius:22px}.logo{width:190px}.xpress{font-size:16px;margin-bottom:8px}p{font-size:15px}.footer{font-size:11px}}
</style>
</head>
